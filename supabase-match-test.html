<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Padel – isoleret resultattest</title><style>body{font:16px system-ui;background:#eef6f2;color:#173b30;max-width:720px;margin:20px auto;padding:16px}.card{background:white;border-radius:12px;padding:18px;margin:12px 0}input,button{font:inherit;padding:10px;margin:5px;box-sizing:border-box}button{background:#176e52;color:white;border:0;border-radius:7px}button:disabled{opacity:.5}input[type=number]{width:75px}input[type=email],input[type=password]{width:90%}pre{white-space:pre-wrap}small{color:#49675d}</style></head><body><h1>🎾 Sikker resultattest</h1><p>Kun 8 fiktive testspillere. Dine 43 rigtige spillere og historik berøres ikke.</p><div class="card" id="auth"><h2>Administratorlogin</h2><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Adgangskode"><button id="login">Log ind</button></div><div class="card" id="tools" hidden><button id="reset">Opret/nulstil testturnering</button><button id="refresh" type="button">Hent testresultater</button><p id="feedback" role="status" aria-live="polite">Klik for at hente de seneste resultater.</p><p><small>Nulstil påvirker kun testturneringen.</small></p></div><div id="matches"></div><div class="card"><h3>Status</h3><pre id="status">Log ind for at begynde.</pre></div><script>
const URL='https://spukhyzmfeseggvutifz.supabase.co',KEY='sb_publishable_ON2uLdmVaQEjXGUjTDkZbw_d6uW54BZ';
let token=null,busy=false;
const el=id=>document.getElementById(id);
async function rpc(name,body={}){const r=await fetch(URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});const data=await r.json().catch(()=>null);if(!r.ok)throw Error(data?.message||'HTTP '+r.status);return data}
function render(s){const matches=s?.rounds?.[0]?.matches||[],p=new Map((s?.squad||[]).map(x=>[x.id,x]));el('matches').innerHTML=matches.map(m=>'<div class="card"><h3>Bane '+(m.court===0?'B10':'B11')+'</h3><p>'+m.teamA.map(id=>p.get(id)?.name).join(' / ')+' mod '+m.teamB.map(id=>p.get(id)?.name).join(' / ')+'</p>'+(m.saved?'<strong>Gemt: '+m.scoreA+'–'+m.scoreB+'</strong>':'<input type="number" min="0" max="99" id="a-'+m.id+'" placeholder="Par 1"><input type="number" min="0" max="99" id="b-'+m.id+'" placeholder="Par 2"><button data-match="'+m.id+'">Gem</button>')+'</div>').join('');document.querySelectorAll('[data-match]').forEach(b=>b.onclick=()=>save(b.dataset.match));el('status').textContent=(s?.squad||[]).map(x=>x.name+': '+x.ratingPoints+' point, '+x.games+' kampe').join('\n')||'Ingen testturnering endnu.'}
async function refresh(){const btn=el('refresh');btn.disabled=true;el('status').textContent='Henter de nyeste testresultater fra Supabase…';try{const data=await rpc('padel_admin_test_get');render(data);el('feedback').textContent='✓ Opdateret fra Supabase kl. '+new Date().toLocaleTimeString('da-DK');}catch(e){el('status').textContent='Kunne ikke hente resultater: '+e.message;el('feedback').textContent='Opdatering mislykkedes';}finally{btn.disabled=false}}
async function save(id){if(busy)return;const a=el('a-'+id),b=el('b-'+id);if(!a.value||!b.value){alert('Udfyld begge felter');return}const x=Number(a.value),y=Number(b.value);if(!Number.isInteger(x)||!Number.isInteger(y)||x<0||y<0||x>99||y>99||x===y){alert('Indtast to forskellige heltal fra 0 til 99');return}busy=true;try{render(await rpc('padel_admin_test_score',{p_match_id:id,p_score_a:x,p_score_b:y}));alert('Resultat gemt')}catch(e){alert('Afvist: '+e.message);await refresh()}finally{busy=false}}
el('login').onclick=async()=>{try{const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:el('email').value.trim(),password:el('password').value})});const a=await r.json();el('password').value='';if(!r.ok||!a.access_token)throw Error('Login afvist');token=a.access_token;await rpc('padel_admin_test_get');el('auth').hidden=true;el('tools').hidden=false;await refresh()}catch(e){el('status').textContent='Fejl: '+e.message+' (Har du kørt SQL 05?)'}};
el('reset').onclick=async()=>{if(!confirm('Nulstil KUN de 8 fiktive testspillere?'))return;try{render(await rpc('padel_admin_test_reset'))}catch(e){el('status').textContent=e.message}};
el('refresh').onclick=refresh;
</script></body></html>
