<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiddleAgePadel – fælles testvisning</title>
<style>body{font:16px system-ui,sans-serif;margin:0;background:#061817;color:#eef7f2}main{max-width:900px;margin:auto;padding:20px}h1{margin-bottom:5px}p{line-height:1.5}.muted{color:#afc9bc}.card{border:1px solid #31574b;border-radius:14px;padding:15px;margin:12px 0;background:#102a22}button{background:#2b8d69;color:white;border:0;border-radius:9px;padding:12px 18px;font:inherit;cursor:pointer}input{width:100%;box-sizing:border-box;font:inherit;padding:12px;margin:6px 0 12px;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #31574b}th:last-child,td:last-child{text-align:right}.hidden{display:none}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}small{color:#afc9bc}</style></head><body><main>
<h1>🎾 MiddleAgePadel</h1><p class="muted">Testversion · læser fra Supabase · ingen ændringer i data</p>
<div class="card" id="loginPanel"><h2>Administratorlogin</h2><label>E-mail<input id="email" type="email" autocomplete="username"></label><label>Adgangskode<input id="password" type="password" autocomplete="current-password"></label><button id="login">Log ind og vis fælles data</button><p id="message" role="status"></p></div>
<div id="content" class="hidden"><div class="card"><button id="refresh">Opdatér fra Supabase</button><button id="logout">Log ud</button><p id="status"></p></div><div class="card"><h2>Rangliste · samlet</h2><div id="leaderboard"></div></div><div class="card"><h2>Aktuelle kampe</h2><div id="matches"></div></div><div class="card"><h2>Turneringshistorik</h2><div id="history"></div></div></div>
<p><small>Kun administrator kan åbne denne testvisning. Fælles spilleradgang kommer i næste fase. Dine data ændres ikke.</small></p>
</main><script>
'use strict';
const URL='https://spukhyzmfeseggvutifz.supabase.co', KEY='sb_publishable_ON2uLdmVaQEjXGUjTDkZbw_d6uW54BZ';
let token=null;
const byId=id=>document.getElementById(id);
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(){
 if(!token)return;
 const res=await fetch(URL+'/rest/v1/padel_state?select=version,updated_at,data&id=eq.main',{headers:{apikey:KEY,Authorization:'Bearer '+token},cache:'no-store'});
 if(!res.ok){if(res.status===401){token=null;byId('content').classList.add('hidden');byId('loginPanel').classList.remove('hidden');}throw Error('Kunne ikke hente data (HTTP '+res.status+').');}
 const rows=await res.json();if(!rows.length)throw Error('Ingen data i Supabase.');
 const row=rows[0],s=row.data,players=Array.isArray(s.squad)?s.squad:[],map=new Map(players.map(p=>[p.id,p]));
 byId('status').textContent='Databaseversion '+row.version+' · '+players.length+' spillere · '+(s.tournamentHistory||[]).length+' historiske turneringer · sidst gemt '+new Date(row.updated_at).toLocaleString('da-DK');
 const sorted=[...players].sort((a,b)=>(b.ratingPoints||0)-(a.ratingPoints||0)||a.name.localeCompare(b.name,'da'));
 byId('leaderboard').innerHTML='<table><thead><tr><th>Nr.</th><th>Spiller</th><th>Kampe</th><th>Rating</th></tr></thead><tbody>'+sorted.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(p.name)+'</td><td>'+Number(p.games||0)+'</td><td>'+Number(p.ratingPoints||0)+'</td></tr>').join('')+'</tbody></table>';
 const courts={1:'B10',2:'B11',3:'B12',4:'B13',5:'B9'};
 const rounds=Array.isArray(s.rounds)?s.rounds:[],round=rounds.find(r=>r.roundNumber===s.currentRound)||rounds[rounds.length-1];
 byId('matches').innerHTML=round?.matches?.length?round.matches.map(m=>'<div class="card"><strong>Bane '+esc(courts[m.court]||m.court)+'</strong> · Runde '+Number(round.roundNumber)+'<div class="teams"><span>'+esc((m.teamA||[]).map(id=>map.get(id)?.name||'?').join(' / '))+'</span><strong>'+(m.saved?esc(m.scoreA)+'–'+esc(m.scoreB):'mod')+'</strong><span>'+esc((m.teamB||[]).map(id=>map.get(id)?.name||'?').join(' / '))+'</span></div></div>').join(''):'Ingen aktive kampe.';
 const history=Array.isArray(s.tournamentHistory)?s.tournamentHistory:[];
 byId('history').innerHTML=history.length?history.map(t=>'<div class="card">'+esc(t.date?new Date(t.date).toLocaleDateString('da-DK'):'Ukendt dato')+' · Vinder: '+esc(t.winner||'–')+'</div>').join(''):'Ingen historiske turneringer.';
}
byId('login').onclick=async()=>{
 const button=byId('login');button.disabled=true;byId('message').textContent='Logger ind...';
 try{
  const res=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:byId('email').value.trim(),password:byId('password').value})});
  const auth=await res.json();byId('password').value='';if(!res.ok||!auth.access_token)throw Error('Login mislykkedes.');
  token=auth.access_token;await load();byId('loginPanel').classList.add('hidden');byId('content').classList.remove('hidden');byId('message').textContent='';
 }catch(e){token=null;byId('message').textContent=e.message;}finally{button.disabled=false;}
};
byId('refresh').onclick=async()=>{try{await load();}catch(e){byId('status').textContent=e.message;}};
byId('logout').onclick=()=>{token=null;byId('content').classList.add('hidden');byId('loginPanel').classList.remove('hidden');};
</script></body></html>
